name: ci

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: '24'
                  cache: true
                  run-install: false

            - name: Install
              run: npm ci

            - name: Prepare
              run: npm run dev:prepare

            - name: Check
              run: npm run check

            - name: Test
              run: npm run test

            - name: Build
              run: npm run prepack
